[project]
name = "hello-agent"
version = "0.1.0"
description = "Hello-world agent-authz agent packaged for LangSmith Deployment"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2",
    "langgraph>=1.1",
    "langchain-openai>=1.6.7",
    "langchain-mcp-adapters>=0.3",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4",
    "langsmith>=0.4",
    "fastmcp>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_agent"]
